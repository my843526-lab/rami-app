<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rami - Your World</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    header {
      background: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px #00000010;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #6c35d5;
    }

    .tagline {
      font-size: 12px;
      color: #667085;
    }

    .profile {
      background: #eee7ff;
      border-radius: 50%;
      padding: 11px;
      font-size: 20px;
    }

    .categories {
      display: flex;
      gap: 10px;
      padding: 14px;
      overflow-x: auto;
    }

    .categories button {
      border: 0;
      border-radius: 22px;
      padding: 10px 16px;
      background: white;
      color: #333;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .categories button.active {
      background: #6c35d5;
      color: white;
    }

    .welcome {
      margin: 0 14px 14px;
      padding: 20px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #6c35d5, #e34c9a);
    }

    .welcome h2 { margin: 0 0 8px; }
    .welcome p { margin: 0; line-height: 1.5; }

    .section-title {
      margin: 18px 14px 10px;
      font-size: 19px;
    }

    .feed {
      margin: 0 14px 90px;
      background: white;
      border-radius: 16px;
      padding: 16px;
      min-height: 230px;
    }

    .video-placeholder {
      height: 145px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e9ddff, #ffe0ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .feed p { color: #667085; }

    .feed img,
    .feed video {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      background: #111;
    }

    .action-button {
      border: 0;
      border-radius: 22px;
      padding: 12px 18px;
      background: #6c35d5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 4px;
      box-shadow: 0 -2px 10px #00000012;
    }

    nav button {
      border: 0;
      background: none;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    nav span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    nav .create {
      color: #6c35d5;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="logo">Rami ✨</div>
      <div class="tagline">Your world, your memories</div>
    </div>
    <div class="profile">👤</div>
  </header>

  <div class="categories">
    <button class="active" type="button">For You</button>
    <button type="button">Knowledge</button>
    <button type="button">Entertainment</button>
    <button type="button">Memories</button>
    <button type="button">Live</button>
  </div>

  <section class="welcome">
    <h2>Welcome to Rami 🇵🇰</h2>
    <p>Share your talent, learn something new, save your memories and grow together.</p>
  </section>

  <h3 class="section-title">Your Rami Feed</h3>

  <section class="feed">
    <div class="video-placeholder">▶️</div>
    <h3>Your Rami journey starts here!</h3>
    <p>Videos, knowledge, entertainment and memories — all in one place.</p>
  </section>

  <nav>
    <button type="button" data-page="Home"><span>🏠</span>Home</button>
    <button type="button" data-page="Discover"><span>🔎</span>Discover</button>
    <button type="button" class="create" data-page="Create"><span>➕</span>Create</button>
    <button type="button" data-page="Memories"><span>💖</span>Memories</button>
    <button type="button" data-page="Profile"><span>👤</span>Profile</button>
  </nav>

  <input id="mediaPicker" type="file" accept="image/*,video/*" hidden>

  <script>
    const categoryButtons = document.querySelectorAll(".categories button");
    const navButtons = document.querySelectorAll("nav button");
    const feed = document.querySelector(".feed");
    const sectionTitle = document.querySelector(".section-title");
    const mediaPicker = document.getElementById("mediaPicker");

    function showPage(title, icon, text) {
      sectionTitle.textContent = title;
      feed.innerHTML = `
        <div class="video-placeholder">${icon}</div>
        <h3>${title}</h3>
        <p>${text}</p>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    const categories = {
      "For You": {
        title: "Your Rami Feed",
        icon: "▶️",
        text: "Discover videos, stories and inspiring people on Rami."
      },
      "Knowledge": {
        title: "Learn Something New",
        icon: "📚",
        text: "Knowledge videos and useful tips will appear here."
      },
      "Entertainment": {
        title: "Enjoy & Have Fun",
        icon: "🎉",
        text: "Funny videos, creative clips and entertainment will appear here."
      },
      "Memories": {
        title: "Your Memories",
        icon: "💖",
        text: "A special place for your photos, videos and favorite moments."
      },
      "Live": {
        title: "Rami Live",
        icon: "🔴",
        text: "Live streaming will be added in a future update."
      }
    };

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        categoryButtons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");

        const selected = categories[button.textContent.trim()];
        if (selected) {
          showPage(selected.title, selected.icon, selected.text);
        }
      });
    });

    navButtons.forEach(button => {
      button.addEventListener("click", () => {
        const page = button.dataset.page;

        if (page === "Home") {
          categoryButtons.forEach(item => item.classList.remove("active"));
          categoryButtons[0].classList.add("active");
          showPage(
            "Your Rami Feed",
            "▶️",
            "Welcome back! Discover videos, knowledge and memories."
          );
        }

        if (page === "Discover") {
          showPage(
            "Discover Rami",
            "🔎",
            "Explore new creators, trending videos and interesting topics."
          );
        }

        if (page === "Create") {
          mediaPicker.click();
        }

        if (page === "Memories") {
          showPage(
            "Your Memories",
            "💖",
            "Your special photos and videos can be selected here. Saving them to an account will be added later."
          );
        }

        if (page === "Profile") {
          showPage(
            "Your Profile",
            "👤",
            "Your profile, posts and creator information will appear here."
          );
        }
      });
    });

    mediaPicker.addEventListener("change", () => {
      const file = mediaPicker.files[0];
      if (!file) return;

      const fileURL = URL.createObjectURL(file);
      sectionTitle.textContent = "Create on Rami";

      if (file.type.startsWith("image/")) {
        feed.innerHTML = `
          <h3>Photo selected</h3>
          <img src="${fileURL}" alt="Selected photo">
          <p>${file.name}</p>
          <p>This is a local preview. Posting online will be added later.</p>
        `;
      } else if (file.type.startsWith("video/")) {
        feed.innerHTML = `
          <h3>Video selected</h3>
          <video src="${fileURL}" controls></video>
          <p>${file.name}</p>
          <p>This is a local preview. Posting online will be added later.</p>
        `;
      }
    });
  </script>
</body>
</html>
