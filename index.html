
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rami - Your World</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div>
      <div class="logo">Rami ✨</div>
      <div class="tagline">Your world, your memories</div>
    </div>
    <div class="profile">👤</div>
  </header>

  <div class="categories">
    <button class="active" type="button">For You</button>
    <button type="button">Knowledge</button>
    <button type="button">Entertainment</button>
    <button type="button">Memories</button>
    <button type="button">Live</button>
  </div>

  <section class="welcome">
    <h2>Welcome to Rami 🇵🇰</h2>
    <p>Share your talent, learn something new, save your memories and grow together.</p>
  </section>

  <h3 class="section-title">Your Rami Feed</h3>

  <section class="feed">
    <div class="video-placeholder">▶️</div>
    <h3>Your Rami journey starts here!</h3>
    <p>Videos, knowledge, entertainment and memories — all in one place.</p>
  </section>

  <nav>
    <button type="button" data-page="Home"><span>🏠</span>Home</button>
    <button type="button" data-page="Discover"><span>🔎</span>Discover</button>
    <button type="button" class="create" data-page="Create"><span>➕</span>Create</button>
    <button type="button" data-page="Memories"><span>💖</span>Memories</button>
    <button type="button" data-page="Profile"><span>👤</span>Profile</button>
  </nav>

  <input id="mediaPicker" type="file" accept="image/*,video/*" hidden>

  <script src="app.js"></script>
</body>
</html>
