
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rami - Your World</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }
    header {
      background: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px #00000010;
    }
    .logo { font-size: 27px; font-weight: bold; color: #6c35d5; }
    .tagline { font-size: 12px; color: #667085; }
    .profile {
      background: #eee7ff;
      border-radius: 50%;
      padding: 11px;
      font-size: 20px;
    }
    .categories {
      display: flex;
      gap: 10px;
      padding: 14px;
      overflow-x: auto;
    }
    .categories button {
      border: 0;
      border-radius: 22px;
      padding: 10px 16px;
      background: white;
      color: #333;
      font-weight: bold;
      white-space: nowrap;
    }
    .categories button.active {
      background: #6c35d5;
      color: white;
    }
    .welcome {
      margin: 0 14px 14px;
      padding: 20px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #6c35d5, #e34c9a);
    }
    .welcome h2 { margin: 0 0 8px; }
    .welcome p { margin: 0; line-height: 1.5; }
    .section-title { margin: 18px 14px 10px; font-size: 19px; }
    .feed {
      margin: 0 14px 90px;
      background: white;
      border-radius: 16px;
      padding: 16px;
      min-height: 230px;
    }
    .video-placeholder {
      height: 145px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e9ddff, #ffe0ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
    .feed p { color: #667085; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 4px;
      box-shadow: 0 -2px 10px #00000012;
    }
    nav button {
      border: 0;
      background: none;
      font-size: 12px;
      color: #555;
    }
    nav span { display: block; font-size: 22px; margin-bottom: 3px; }
    nav .create { color: #6c35d5; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="logo">Rami ✨</div>
      <div class="tagline">Your world, your memories</div>
    </div>
    <div class="profile">👤</div>
  </header>

  <div class="categories">
    <button class="active">For You</button>
    <button>Knowledge</button>
    <button>Entertainment</button>
    <button>Memories</button>
    <button>Live</button>
  </div>

  <section class="welcome">
    <h2>Welcome to Rami 🇵🇰</h2>
    <p>Share your talent, learn something new, save your memories and grow together.</p>
  </section>

  <h3 class="section-title">Discover</h3>
  <section class="feed">
    <div class="video-placeholder">▶️</div>
    <h3>Your Rami journey starts here!</h3>
    <p>Videos, knowledge, entertainment and memories — all in one place.</p>
  </section>

  <nav>
    <button><span>🏠</span>Home</button>
    <button><span>🔎</span>Discover</button>
    <button class="create"><span>➕</span>Create</button>
    <button><span>💖</span>Memories</button>
    <button><span>👤</span>Profile</button>
  </nav>
</body>
  </html>
